name: Publicar no GitHub Pages

on:
  push:
    branches: [claude/festive-cannon-p7n4ye, main]
  schedule:
    # dias úteis, 10h15, 13h15, 16h15 e 19h15 (horário de Brasília) — coleta de dados de mercado
    - cron: '15 13,16,19,22 * * 1-5'
    # sábado: atualiza Tesouro/indicadores do fechamento da semana
    - cron: '40 12 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Coletar dados de mercado (B3, CVM, Banco Central, Tesouro; Yahoo como fallback)
        run: npx vite-node scripts/fetch-market.ts
        continue-on-error: true
      # se o robô falhar por completo, publica de novo os últimos dados válidos em vez de um site sem dados (achado D-02)
      - name: Garantir market-data.json
        run: test -s public/market-data.json || curl -fsSL "https://aj8067910-dotcom.github.io/invest/market-data.json" -o public/market-data.json || echo "sem dados anteriores"

      - run: npm run build
      - name: Publicar dist/ no branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Publicação automática'
      # o GitHub desativa agendamentos após 60 dias sem atividade no repositório; isto os mantém ativos
      - uses: liskin/gh-workflow-keepalive@v1
        if: github.event_name == 'schedule'
